name: Flutter checks

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      - name: Verify Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Prepare optional local environment file
        run: touch .env

      - name: Resolve dependencies
        run: flutter pub get

      - name: Confirm cloud dependencies are absent
        run: |
          if grep -Eiq 'firebase|cloud_firestore|mixpanel_flutter|google_sign_in' pubspec.lock; then
            echo "Forbidden cloud or analytics dependency found in pubspec.lock."
            exit 1
          fi

      - name: Analyze Dart code
        id: analyze
        continue-on-error: true
        run: |
          set +e
          dart analyze --format machine 2>&1 | tee analyze.log
          status=${PIPESTATUS[0]}
          error_count=0

          while IFS='|' read -r severity type code file line column length message; do
            case "$severity" in
              ERROR)
                level=error
                error_count=$((error_count + 1))
                ;;
              WARNING) level=warning ;;
              INFO) level=notice ;;
              *) continue ;;
            esac
            file="${file#file://}"
            file="${file#"$GITHUB_WORKSPACE/"}"
            echo "::${level} file=${file},line=${line},col=${column},endColumn=$((column + length))::${message}"
          done < analyze.log

          if [ "$status" -ne 0 ] && ! grep -Eq '^(ERROR|WARNING|INFO)\|' analyze.log; then
            exit "$status"
          fi

          if [ "$error_count" -gt 0 ]; then
            exit 1
          fi

          exit 0

      - name: Upload analyzer output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-output
          path: analyze.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop after analyzer failure
        if: steps.analyze.outcome == 'failure'
        run: exit 1

      - name: Run Flutter tests
        run: |
          if [ -d test ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "No Flutter tests found; continuing."
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flixquest-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14