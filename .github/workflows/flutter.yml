name: Flutter checks

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      - name: Verify Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Prepare optional local environment file
        run: touch .env

      - name: Resolve dependencies
        run: flutter pub get

      - name: Confirm cloud dependencies are absent
        run: |
          if grep -Eiq 'firebase|cloud_firestore|mixpanel_flutter|google_sign_in' pubspec.lock; then
            echo "Forbidden cloud or analytics dependency found in pubspec.lock."
            exit 1
          fi

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: |
          if [ -d test ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "No Flutter tests found; continuing."
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flixquest-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14