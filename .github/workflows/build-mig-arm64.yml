name: Build MIG ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "assets/**"
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-mig-arm64.yml"

concurrency:
  group: mig-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build MIG Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.35.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Prepare environment
        run: printf '' > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --tree-shake-icons \
            --split-debug-info=build/mig-symbols

      - name: Verify ARM64 APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/'
          if unzip -Z1 "$APK" | grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "::error::The APK contains a non-ARM64 ABI"
            exit 1
          fi
          echo "APK size: $(du -h "$APK" | cut -f1)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MIG-arm64-release
          path: build/app/outputs/flutter-apk/app-release.apk
          compression-level: 0
          retention-days: 30

      - name: Upload Dart symbols
        uses: actions/upload-artifact@v4
        with:
          name: MIG-arm64-symbols
          path: build/mig-symbols
          if-no-files-found: ignore
          retention-days: 30